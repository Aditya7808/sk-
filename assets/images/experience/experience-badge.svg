<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#D4962E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A3A5C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- Inner disc -->
  <circle cx="100" cy="100" r="74" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Star -->
  <path d="M100 40 L110 78 L148 78 L118 102 L130 140 L100 118 L70 140 L82 102 L52 78 L90 78 Z" fill="url(#gold)"/>
  <!-- Paint brush -->
  <rect x="92" y="118" width="16" height="50" rx="3" fill="#FFFFFF"/>
  <rect x="88" y="162" width="24" height="10" rx="3" fill="#E8A838"/>
  <rect x="84" y="110" width="32" height="10" rx="5" fill="#1A3A5C"/>
  <!-- Small paint drop -->
  <path d="M130 130 C130 122 138 122 138 130 C138 138 130 142 130 142 C130 142 122 138 122 130 C122 122 130 122 130 130 Z" fill="url(#gold)"/>
  <text x="100" y="192" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#E8A838" text-anchor="middle">YEARS</text>
</svg>