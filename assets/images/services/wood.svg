<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#D4962E"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="50%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#2B5EA7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Wooden door -->
  <rect x="200" y="100" width="400" height="340" fill="url(#wood)"/>
  <!-- Wood grain lines -->
  <g stroke="#E8A838" stroke-width="2" opacity="0.5" fill="none">
    <path d="M220 140 Q300 150 380 140"/>
    <path d="M220 180 Q300 190 380 180"/>
    <path d="M220 220 Q300 230 380 220"/>
    <path d="M220 260 Q300 270 380 260"/>
    <path d="M220 300 Q300 310 380 300"/>
    <path d="M220 340 Q300 350 380 340"/>
  </g>
  <!-- PU shine overlay -->
  <rect x="200" y="100" width="400" height="340" fill="url(#shine)"/>
  <!-- Door panels -->
  <rect x="240" y="140" width="140" height="100" rx="4" fill="none" stroke="#E8A838" stroke-width="3" opacity="0.6"/>
  <rect x="420" y="140" width="140" height="100" rx="4" fill="none" stroke="#E8A838" stroke-width="3" opacity="0.6"/>
  <rect x="240" y="270" width="140" height="100" rx="4" fill="none" stroke="#E8A838" stroke-width="3" opacity="0.6"/>
  <rect x="420" y="270" width="140" height="100" rx="4" fill="none" stroke="#E8A838" stroke-width="3" opacity="0.6"/>
  <!-- Handle -->
  <circle cx="560" cy="240" r="12" fill="#FFFFFF"/>
  <rect x="548" y="236" width="24" height="8" rx="4" fill="#FFFFFF"/>
  <!-- Painter polishing -->
  <rect x="120" y="250" width="10" height="160" fill="#D4D4D4"/>
  <rect x="105" y="240" width="40" height="12" fill="#C0C0C0"/>
  <rect x="105" y="390" width="40" height="12" fill="#C0C0C0"/>
  <circle cx="130" cy="200" r="18" fill="#F2D9B1"/>
  <rect x="114" y="175" width="32" height="28" fill="#FFFFFF"/>
  <rect x="114" y="203" width="32" height="60" fill="#FFFFFF"/>
  <rect x="110" y="260" width="38" height="10" fill="#FFFFFF"/>
  <rect x="80" y="200" width="34" height="6" fill="#8B8B8B"/>
  <rect x="126" y="196" width="8" height="44" fill="#8B8B8B"/>
  <rect x="90" y="192" width="18" height="14" rx="3" fill="#2B5EA7"/>
  <!-- Polish cloth -->
  <rect x="150" y="240" width="30" height="18" rx="3" fill="#FFFFFF" opacity="0.8"/>
  <!-- Brand tag -->
  <rect x="40" y="40" width="150" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="115" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wood Polishing</text>
</svg>