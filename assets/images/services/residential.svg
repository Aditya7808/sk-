<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#D4962E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A87C"/>
      <stop offset="100%" stop-color="#A88B63"/>
    </linearGradient>
  </defs>
  <!-- Room background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Floor -->
  <rect y="360" width="800" height="140" fill="url(#floor)"/>
  <!-- Back wall being painted -->
  <rect x="120" y="60" width="420" height="300" fill="url(#wall)" opacity="0.92"/>
  <!-- Side wall -->
  <rect x="540" y="60" width="260" height="300" fill="#1A3A5C" opacity="0.55"/>
  <!-- Ceiling -->
  <rect y="0" width="800" height="60" fill="#1A3A5C" opacity="0.4"/>
  <!-- Window -->
  <rect x="560" y="110" width="200" height="160" fill="#E8A838" opacity="0.25"/>
  <rect x="560" y="110" width="200" height="160" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
  <line x1="660" y1="110" x2="660" y2="270" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <line x1="560" y1="190" x2="760" y2="190" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <!-- Painter on ladder -->
  <rect x="250" y="250" width="14" height="130" fill="#D4D4D4"/>
  <rect x="230" y="240" width="54" height="14" fill="#C0C0C0"/>
  <rect x="230" y="370" width="54" height="14" fill="#C0C0C0"/>
  <circle cx="340" cy="170" r="30" fill="#F2D9B1"/>
  <rect x="318" y="140" width="44" height="40" fill="#FFFFFF"/>
  <rect x="320" y="180" width="40" height="90" fill="#FFFFFF"/>
  <rect x="316" y="265" width="48" height="14" fill="#FFFFFF"/>
  <!-- Roller arm -->
  <rect x="290" y="185" width="60" height="6" fill="#8B8B8B"/>
  <rect x="345" y="180" width="10" height="70" fill="#8B8B8B"/>
  <!-- Paint roller -->
  <rect x="250" y="175" width="30" height="24" rx="4" fill="#2B5EA7"/>
  <!-- Paint tray -->
  <rect x="560" y="410" width="120" height="40" rx="4" fill="#1A3A5C" opacity="0.6"/>
  <rect x="565" y="415" width="110" height="30" rx="3" fill="#2B5EA7" opacity="0.5"/>
  <!-- Brand tag -->
  <rect x="40" y="40" width="120" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="100" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Residential</text>
</svg>