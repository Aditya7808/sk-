<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#D4962E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Terrace floor -->
  <rect y="360" width="800" height="140" fill="#1A3A5C" opacity="0.6"/>
  <!-- Wall -->
  <rect x="120" y="80" width="300" height="280" fill="url(#wall)" opacity="0.9"/>
  <!-- Parapet -->
  <rect x="100" y="60" width="340" height="20" fill="#2B5EA7" opacity="0.8"/>
  <!-- Rain -->
  <g stroke="#3A7BD5" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="480" y1="60" x2="470" y2="100"/>
    <line x1="520" y1="70" x2="510" y2="110"/>
    <line x1="560" y1="55" x2="550" y2="95"/>
    <line x1="600" y1="75" x2="590" y2="115"/>
    <line x1="640" y1="65" x2="630" y2="105"/>
    <line x1="680" y1="80" x2="670" y2="120"/>
  </g>
  <!-- Water droplets -->
  <g fill="#3A7BD5" opacity="0.7">
    <circle cx="300" cy="300" r="4"/>
    <circle cx="340" cy="320" r="3"/>
    <circle cx="280" cy="330" r="3"/>
  </g>
  <!-- Protective shield overlay -->
  <path d="M400 180 L520 210 L520 300 C520 340 460 370 400 370 C340 370 280 340 280 300 L280 210 Z" fill="url(#shield)" opacity="0.85"/>
  <path d="M400 180 L520 210 L520 300 C520 340 460 370 400 370 C340 370 280 340 280 300 L280 210 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <!-- Checkmark -->
  <path d="M340 260 L385 305 L460 230" fill="none" stroke="#E8A838" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Painter applying coating -->
  <rect x="620" y="250" width="10" height="140" fill="#D4D4D4"/>
  <rect x="605" y="240" width="40" height="12" fill="#C0C0C0"/>
  <rect x="605" y="380" width="40" height="12" fill="#C0C0C0"/>
  <circle cx="630" cy="205" r="18" fill="#F2D9B1"/>
  <rect x="614" y="185" width="32" height="24" fill="#FFFFFF"/>
  <rect x="614" y="209" width="32" height="60" fill="#FFFFFF"/>
  <rect x="610" y="265" width="38" height="10" fill="#FFFFFF"/>
  <rect x="580" y="205" width="34" height="6" fill="#8B8B8B"/>
  <rect x="626" y="202" width="8" height="44" fill="#8B8B8B"/>
  <rect x="590" y="198" width="18" height="14" rx="3" fill="#2B5EA7"/>
  <!-- Brand tag -->
  <rect x="40" y="40" width="130" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="105" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Waterproofing</text>
</svg>