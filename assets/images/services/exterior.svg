<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="60%" stop-color="#D4962E"/>
      <stop offset="100%" stop-color="#B87A22"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B5EA7"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="660" cy="120" r="70" fill="#2B5EA7" opacity="0.25"/>
  <circle cx="660" cy="120" r="40" fill="#2B5EA7" opacity="0.5"/>
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.5">
    <ellipse cx="180" cy="140" rx="50" ry="16"/>
    <ellipse cx="210" cy="135" rx="35" ry="12"/>
    <ellipse cx="430" cy="200" rx="45" ry="14"/>
    <ellipse cx="460" cy="195" rx="30" ry="10"/>
  </g>
  <!-- House -->
  <rect x="160" y="200" width="480" height="260" fill="url(#facade)" opacity="0.92"/>
  <!-- Roof -->
  <polygon points="120,200 680,200 400,110" fill="#E8A838"/>
  <!-- Windows -->
  <g fill="#E8A838" opacity="0.4">
    <rect x="220" y="260" width="60" height="70" rx="3"/>
    <rect x="340" y="260" width="60" height="70" rx="3"/>
    <rect x="460" y="260" width="60" height="70" rx="3"/>
  </g>
  <!-- Door -->
  <rect x="370" y="360" width="60" height="100" fill="#E8A838" opacity="0.7" rx="3"/>
  <!-- Painter on scaffold -->
  <rect x="520" y="250" width="10" height="210" fill="#D4D4D4"/>
  <rect x="500" y="240" width="50" height="12" fill="#C0C0C0"/>
  <rect x="500" y="440" width="50" height="12" fill="#C0C0C0"/>
  <circle cx="545" cy="200" r="20" fill="#F2D9B1"/>
  <rect x="528" y="180" width="34" height="26" fill="#FFFFFF"/>
  <rect x="528" y="206" width="34" height="70" fill="#FFFFFF"/>
  <rect x="524" y="270" width="42" height="12" fill="#FFFFFF"/>
  <rect x="490" y="200" width="40" height="6" fill="#8B8B8B"/>
  <rect x="538" y="196" width="8" height="50" fill="#8B8B8B"/>
  <rect x="495" y="192" width="20" height="16" rx="3" fill="#2B5EA7"/>
  <!-- Ground -->
  <rect y="460" width="800" height="40" fill="#1A3A5C" opacity="0.5"/>
  <!-- Brand tag -->
  <rect x="40" y="40" width="120" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="100" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exterior</text>
</svg>